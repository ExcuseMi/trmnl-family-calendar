<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Metro Calendar</title>
  <rect width="128" height="128" rx="24" fill="#ffffff"/>
  <rect x="4" y="4" width="120" height="120" rx="20" fill="none" stroke="#000000" stroke-width="6"/>
  <!-- trunk line with two branches leaving at 45 degrees -->
  <path d="M18 78 H110" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <path d="M40 78 L58 60 H100" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 78 L78 94 H108" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 8"/>
  <!-- stations -->
  <circle cx="40" cy="78" r="7" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="62" cy="78" r="7" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="86" cy="60" r="7" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <!-- calendar tab: the day number as the map's title -->
  <text x="64" y="44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#000000">8</text>
</svg>
