# Local dev config.
#
# transform_runtime is disabled, so this hand-feeds what transform.js's
# demo data produces. Regenerate the `metro:` block after changing the demo
# data (timestamp 1788870600 = Tue 8 Sep 2026 14:30 Europe/Brussels):
#   node -e "require('./src/transform.js')({trmnl:{system:{timestamp_utc:1788870600},user:{time_zone_iana:'Europe/Brussels'},plugin_settings:{custom_fields_values:{use_demo_data:'true'}}}}).then(r=>console.log(JSON.stringify(r.metro,null,2)))"
watch:
- .trmnlp.yml
- src
transform_runtime: disabled
custom_fields: {}
variables:
  trmnl:
    system:
      timestamp_utc: 1788870600
    user:
      locale: en
      time_zone_iana: Europe/Brussels
    plugin_settings:
      instance_name: Metro Timeline
      strategy: polling
      dark_mode: 'no'
      no_screen_padding: 'yes'
      custom_fields_values:
        use_demo_data: 'true'
        config_json: ''
  metro:
