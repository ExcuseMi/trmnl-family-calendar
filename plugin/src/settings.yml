---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 471753
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: A metro-map style single-day calendar. One line per track runs along a central spine with the hour axis down its middle; events branch off as stations (work on one side, family on the other), long events loop out and rejoin, and labels are placed dynamically in lanes so nothing overlaps. Auto-picks a horizontal or vertical timeline to fit the screen and narrows the visible hours on small views. Runs on TRMNL <strong>Serverless</strong>.<br /><br />Turn off "Use Demo Data" and paste a calendar config to show your own ICS calendars.
  github_url: https://github.com/ExcuseMi/trmnl-metro-calendar-plugin
  category: calendar
  help_text: TRMNL X Ready · English, français, español, Deutsch, Nederlands
- keyname: use_demo_data
  field_type: boolean
  name: Use Demo Data
  description: Show built-in example events instead of your own calendars. Turn this off once you have pasted a config below.
  default: true
  optional: true
  conditional_validation:
  - when: 'true'
    hidden:
    - config_json
- keyname: config_json
  field_type: code
  name: Calendar Config (JSON)
  description: 'Only used when Use Demo Data is off. Same shape as this project''s calendar-config.json/demo-config.json (or just paste one ICS URL per line): <br /><code>{"timeZone":"...","rules":[...],"tracks":[{"name":"Sam","color":"blue"}],"calendars":[{"name":"Work","url":"https://.../calendar.ics","headers":{"Authorization":"..."},"includeDescription":false,"rules":[{"match":{"type":"any"},"track":"Sam"}]}]}</code><br />Which side each track renders on is balanced automatically by event count once every calendar loads (busiest first, evenly split) &mdash; set <code>"side": "left"</code> or <code>"right"</code> on a track to pin them instead. The first entry in <code>tracks</code> claims any event no rule assigns. Rule <code>match.type</code>: <code>any</code>/<code>all</code>, <code>exact</code>, <code>word</code>, <code>contains</code>, <code>regex</code>, <code>status</code>, <code>weekday</code>, <code>and</code>/<code>or</code> (with <code>matchers</code>). Actions: <code>track</code> (a name or a list — a list becomes a shared interchange), <code>rename</code>, <code>rewrite</code> (+<code>rewriteFull</code>), <code>hide</code>, <code>allDay</code>. Top-level <code>rules</code> apply to every calendar; a calendar''s own rules win. Set <code>includeDescription: true</code> on a calendar to let its rules also match the event description. Recurring events only show if they use <code>RRULE:FREQ=WEEKLY</code> (optionally with BYDAY/UNTIL) or their start date is today; all-day events are not shown yet. (Legacy configs may use <code>people</code>/<code>person</code> in place of <code>tracks</code>/<code>track</code> &mdash; still accepted.)'
  optional: true
- keyname: time_format
  field_type: select
  name: Time Format
  description: Auto follows your account language (12-hour for US English, 24-hour elsewhere).
  options:
  - Auto: auto
  - 24-hour: 24h
  - 12-hour: 12h
  default: auto
  optional: true
- keyname: lat_lon
  field_type: lat_lon
  name: Location (for weather)
  description: Drives the header weather, sunrise/sunset and the rain start/stop markers on the map. Leave blank to keep the placeholder weather.
  optional: true
name: Metro Calendar
description:
refresh_interval: 15
