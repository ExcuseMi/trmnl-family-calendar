---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 471753
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: Everyone's day as a metro map. Each calendar is a <strong>line</strong>, each event is a <strong>stop</strong> on it, and an event several people share is an <strong>interchange</strong> where their lines converge. A long block like a school day or a shift runs along the main line itself, so you can see who is where and for how long. The map lays itself out to whatever screen it lands on.<br /><br />Until you paste your own calendar links into <strong>Calendars</strong> below, the board rides a built-in example day, so there is nothing to switch on to see it work. Runs on TRMNL <strong>Serverless</strong>.
  github_url: https://github.com/ExcuseMi/trmnl-metro-calendar-plugin
  category: calendar
  help_text: TRMNL X Ready · English, français, español, Deutsch, Nederlands
- keyname: config_json
  field_type: text
  name: Calendars
  placeholder: |-
    https://calendar.example.com/alex.ics
    https://calendar.example.com/sam.ics
  description: 'Paste one calendar link per line. That is all: each calendar becomes a line on the map. Leave it empty and the board shows an example day.<br /><br /><strong>Finding a link</strong><br />Google Calendar: calendar settings, <em>Secret address in iCal format</em>.<br />iCloud: share the calendar publicly, copy the <code>webcal://</code> link.<br />Outlook: calendar settings, publish, copy the ICS link.<br /><br />Want more? The <a href="https://excusemi.github.io/trmnl-metro-calendar-plugin/tools/config-editor.html" target="_blank">Configuration Editor</a> builds it for you and previews the map. Paste what it gives you here. For a public-holiday calendar, add <code>holiday</code> after its link, with a space, so it is not drawn as a person. Details: <a href="https://github.com/ExcuseMi/trmnl-metro-calendar-plugin/blob/main/CONFIG.md" target="_blank">CONFIG.md</a>.'
  optional: true
- keyname: show_day
  field_type: select
  name: Show
  group: The Day
  description: 'Which day the board draws. The last one is what a screen on a wall usually wants: by the evening, the day you need to see is the one you are getting up to.'
  options:
  - Today: today
  - Tomorrow: tomorrow
  - Today, then tomorrow from the evening on: auto
  default: today
  optional: true
  conditional_validation:
  - when: today
    hidden:
    - switch_hour
  - when: tomorrow
    hidden:
    - switch_hour
- keyname: switch_hour
  field_type: number
  name: Switch Over At
  group: The Day
  description: 'The hour the board moves on to tomorrow''s timetable, on a 24-hour clock, so 21 is nine in the evening. Late on purpose: the evening is when a board on a wall is read most, and an early switch throws away dinner and everything after it while people are still standing in front of it. Anything outside 0 to 23, or left blank, is read as 21.'
  placeholder: '21'
  default: 21
  optional: true
- keyname: time_format
  field_type: select
  name: Time Format
  group: The Day
  description: 'How the clock reads, on the hour strip and in the header. Auto follows your TRMNL account language: 12-hour for US English, 24-hour everywhere else.'
  options:
  - Auto: auto
  - 24-hour: 24h
  - 12-hour: 12h
  default: auto
  optional: true
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  group: Weather
  description: Where the board is standing. It drives the weather in the header, the sunrise and sunset marks in the band along the top edge, and the rain start and stop markers across the map. Leave it blank and the board keeps its placeholder weather.
  optional: true
- keyname: temperature_unit
  field_type: select
  name: Temperature Unit
  group: Weather
  description: 'Auto follows your TRMNL account language: Fahrenheit for US English, Celsius everywhere else. The alert thresholds below are read in whichever unit this ends up being.'
  options:
  - Auto: auto
  - Celsius: c
  - Fahrenheit: f
  default: auto
  optional: true
- keyname: alert_enabled
  field_type: boolean
  name: Weather Alert Banner
  group: Weather
  description: 'A service alert along the bottom edge, the way a departure board announces disruption, on a day the forecast crosses one of the thresholds below. Needs a <strong>Location</strong> above. Off by default, and on a day that crosses nothing it takes no space at all: the map gets it back.'
  default: false
  optional: true
  conditional_validation:
  - when: 'false'
    hidden:
    - alert_rain_threshold
    - alert_snow
    - alert_temp_low
    - alert_temp_high
- keyname: alert_rain_threshold
  field_type: number
  name: Rain Chance At Or Above (%)
  group: Weather
  description: The wettest hour still to come is called out once its chance of rain reaches this. 70 is a good "take a coat" line. Blank for no rain alert.
  placeholder: '70'
  default: 70
  optional: true
- keyname: alert_snow
  field_type: boolean
  name: Alert On Snow
  group: Weather
  description: Call out a day whose forecast is snow, whatever the rain chance says.
  default: true
  optional: true
- keyname: alert_temp_low
  field_type: number
  name: Cold At Or Below
  group: Weather
  description: In whichever unit the board is showing, so 0 in Celsius or 32 in Fahrenheit. Blank for no cold alert.
  optional: true
- keyname: alert_temp_high
  field_type: number
  name: Heat At Or Above
  group: Weather
  description: In whichever unit the board is showing, so 30 in Celsius or 86 in Fahrenheit. Blank for no heat alert.
  optional: true
- keyname: use_demo_data
  field_type: boolean
  name: Force Demo Data
  group: Developer
  description: The board already runs a built-in example day whenever <strong>Calendars</strong> is empty, so nobody needs this to see what it draws. Turn it on to keep the example running over a set of real feeds, which is what you want when you are working on the plugin itself and do not want to watch your own family go past.
  default: false
  optional: true
  conditional_validation:
  - when: 'false'
    hidden:
    - demo_set
- keyname: demo_set
  field_type: select
  name: Demo Board
  group: Developer
  description: Which example day the demo runs, both when it is forced above and when it steps in for an empty <strong>Calendars</strong> box. Each one is a real config from this project's <a href="https://github.com/ExcuseMi/trmnl-metro-calendar-plugin/tree/main/demo" target="_blank">demo/</a> folder, so whichever board you like the look of is also a worked example to copy into <strong>Calendars</strong>.
  options:
  - Springfield, a family of five (a school day two of them share, dinner as an interchange): simpsons
  - Planet Express, a work crew (one team calendar, a delivery three of them are on all day): futurama
  - Apartment 20, two flatmates (a long day at a desk, an evening they are both at): friends
  default: simpsons
  optional: true
name: Metro Calendar
description: Everyone's day as a metro map
refresh_interval: 15
