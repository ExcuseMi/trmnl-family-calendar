---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 471753
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: A metro-map style single-day calendar. One line per track runs along a central spine with the hour axis down its middle; events branch off as stations, a long block in one place becomes a siding beside the line, several people in one place become an interchange, and labels are placed in lanes so nothing overlaps. Auto-picks a horizontal or vertical timeline to fit the screen and narrows the visible hours on small views. Runs on TRMNL <strong>Serverless</strong>.<br /><br />Turn off "Use Demo Data" (under Developer) and paste your own ICS links into Calendars to show your own. For anything beyond a plain list, build a config with the <a href="https://excusemi.github.io/trmnl-metro-calendar-plugin/tools/config-editor.html" target="_blank">Configuration Editor</a>.
  github_url: https://github.com/ExcuseMi/trmnl-metro-calendar-plugin
  category: calendar
  help_text: TRMNL X Ready · English, français, español, Deutsch, Nederlands
- keyname: config_json
  field_type: text
  name: Calendars
  placeholder: https://cloud.example.com/alex.ics
  description: 'One ICS link per line is the whole setup: each calendar becomes its own line on the map, named after the calendar, and its events sit on that line. Links may be <code>https://</code> or <code>webcal://</code>. Recurring events show if they use <code>RRULE:FREQ=WEEKLY</code> (optionally with BYDAY/UNTIL) or start today.<br /><br />For anything more than that (routing one calendar''s events to several people, sharing an event between them, renaming or hiding things, feeds that need an auth header) paste a JSON config here instead: whatever is in this box is read as JSON if it parses as JSON, and as a list of links if it does not. Build one in <a href="https://excusemi.github.io/trmnl-metro-calendar-plugin/tools/config-editor.html" target="_blank">the Configuration Editor</a>, which previews the map as it goes and documents every option, or copy one of the demo boards from <a href="https://github.com/ExcuseMi/trmnl-metro-calendar-plugin/tree/main/demo" target="_blank">demo/</a>.'
  optional: true
- keyname: time_format
  field_type: select
  name: Time Format
  description: Auto follows your account language (12-hour for US English, 24-hour elsewhere).
  options:
  - Auto: auto
  - 24-hour: 24h
  - 12-hour: 12h
  default: auto
  optional: true
- keyname: temperature_unit
  field_type: select
  name: Temperature Unit
  description: Auto follows your account language (Fahrenheit for US English, Celsius everywhere else).
  options:
  - Auto: auto
  - Celsius: c
  - Fahrenheit: f
  default: auto
  optional: true
- keyname: lat_lon
  field_type: lat_lon
  name: Location (for weather)
  description: Drives the header weather, sunrise/sunset and the rain start/stop markers on the map. Leave blank to keep the placeholder weather.
  optional: true
- keyname: alert_enabled
  field_type: boolean
  name: Weather Alert Banner
  group: Weather Alert
  description: Draw a full-width banner along the bottom edge when the forecast breaches one of the thresholds below. Needs a location above. Off by default, and it takes no space at all on a day that breaches nothing.
  default: false
  optional: true
  conditional_validation:
  - when: 'false'
    hidden:
    - alert_rain_threshold
    - alert_snow
    - alert_temp_low
    - alert_temp_high
- keyname: alert_rain_threshold
  field_type: number
  name: Rain Chance At Or Above (%)
  group: Weather Alert
  description: The wettest hour of the day is called out once its chance of rain reaches this. Leave blank for no rain alert.
  default: 70
  optional: true
- keyname: alert_snow
  field_type: boolean
  name: Alert On Snow
  group: Weather Alert
  description: Call out a day whose forecast is snow, whatever the rain chance says.
  default: true
  optional: true
- keyname: alert_temp_low
  field_type: number
  name: Cold At Or Below
  group: Weather Alert
  description: In whichever unit the board is showing (see Temperature Unit). Leave blank for no cold alert.
  optional: true
- keyname: alert_temp_high
  field_type: number
  name: Heat At Or Above
  group: Weather Alert
  description: In whichever unit the board is showing (see Temperature Unit). Leave blank for no heat alert.
  optional: true
- keyname: use_demo_data
  field_type: boolean
  name: Use Demo Data
  group: Developer
  description: Show a built-in example board instead of your own calendars. Turn this off once you have filled in Calendars above.
  default: true
  optional: true
  conditional_validation:
  - when: 'true'
    hidden:
    - config_json
  - when: 'false'
    hidden:
    - demo_set
- keyname: demo_set
  field_type: select
  name: Demo Board
  group: Developer
  description: Which example day to show. Each one is a real config in this project's <a href="https://github.com/ExcuseMi/trmnl-metro-calendar-plugin/tree/main/demo" target="_blank">demo/ folder</a>, driven by real ICS files. Copy the one closest to your situation and change the links.
  options:
  - Springfield, a family of five (shared school day, family dinner): simpsons
  - Planet Express, a work crew (one team calendar, a delivery three of them are on all day): futurama
  - Apartment 20, two flatmates (a day at a desk, an evening they are both at): friends
  default: simpsons
  optional: true
name: Metro Calendar
description: Everyone's day as a metro map
refresh_interval: 15
