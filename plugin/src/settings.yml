---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 471753
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: Everyone's day as a metro map. Each calendar is a line, events branch off it as stations, a long block in one place becomes a siding beside the line, and several people in one place become an interchange. The map picks its own shape for the screen it is on.<br /><br />You are looking at an example board until you turn <strong>Use Demo Data</strong> off below and paste your own calendar links in. Runs on TRMNL <strong>Serverless</strong>.
  github_url: https://github.com/ExcuseMi/trmnl-metro-calendar-plugin
  category: calendar
  help_text: TRMNL X Ready · English, français, español, Deutsch, Nederlands
- keyname: use_demo_data
  field_type: boolean
  name: Use Demo Data
  description: On, the board shows a built-in example day so you can see what it does before setting anything up. Turn it off and the Calendars box appears.
  default: true
  optional: true
  conditional_validation:
  - when: 'true'
    hidden:
    - config_json
  - when: 'false'
    hidden:
    - demo_set
- keyname: demo_set
  field_type: select
  name: Demo Board
  description: Which demo day to show. Each one is a real config in this project's <a href="https://github.com/ExcuseMi/trmnl-metro-calendar-plugin/tree/main/demo" target="_blank">demo/</a> folder, so whichever you like the look of is also a worked example to copy.
  options:
  - Springfield, a family of five (shared school day, family dinner): simpsons
  - Planet Express, a work crew (one team calendar, a delivery three of them are on all day): futurama
  - Apartment 20, two flatmates (a day at a desk, an evening they are both at): friends
  default: simpsons
  optional: true
- keyname: config_json
  field_type: text
  name: Calendars
  placeholder: https://cloud.example.com/alex.ics
  description: 'One ICS link per line is the whole setup: each calendar becomes its own line on the map, named after the calendar, and its events sit on that line. Links may be <code>https://</code> or <code>webcal://</code>. Recurring events show if they repeat weekly, or if they start today.<br /><br />For anything more (routing one calendar''s events to several people, sharing an event between them, renaming or hiding things, feeds that need an auth header) paste a JSON config here instead. Whatever is in this box is read as JSON if it parses as JSON, and as a list of links if it does not.<br /><br />Easiest way to build one: the <a href="https://excusemi.github.io/trmnl-metro-calendar-plugin/tools/config-editor.html" target="_blank">Configuration Editor</a>, which previews the map as you go and explains every option.'
  optional: true
- keyname: show_day
  field_type: select
  name: Show
  group: The Day
  description: 'Which day the board draws. The last one is what a screen on a wall usually wants: by the evening, the day you need to see is the one you are getting up to.'
  options:
  - Today: today
  - Tomorrow: tomorrow
  - Today, then tomorrow from the evening on: auto
  default: today
  optional: true
  conditional_validation:
  - when: today
    hidden:
    - switch_hour
  - when: tomorrow
    hidden:
    - switch_hour
- keyname: switch_hour
  field_type: number
  name: Switch Over At
  group: The Day
  description: The hour the board moves on to tomorrow, on a 24-hour clock. Blank means 18, so six in the evening.
  placeholder: '18'
  optional: true
- keyname: time_format
  field_type: select
  name: Time Format
  group: The Day
  description: 'Auto follows your account language: 12-hour for US English, 24-hour everywhere else.'
  options:
  - Auto: auto
  - 24-hour: 24h
  - 12-hour: 12h
  default: auto
  optional: true
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  group: Weather
  description: Drives the weather in the header, sunrise and sunset, and the rain start/stop markers along the map. Leave it blank and the board keeps its placeholder weather.
  optional: true
- keyname: temperature_unit
  field_type: select
  name: Temperature Unit
  group: Weather
  description: 'Auto follows your account language: Fahrenheit for US English, Celsius everywhere else. The alert thresholds below are read in whichever unit this ends up being.'
  options:
  - Auto: auto
  - Celsius: c
  - Fahrenheit: f
  default: auto
  optional: true
- keyname: alert_enabled
  field_type: boolean
  name: Weather Alert Banner
  group: Weather
  description: 'A banner along the bottom edge, in the manner of a service alert on a departure board, when the forecast breaches one of the thresholds below. Needs a Location above. Off by default, and on a day that breaches nothing it takes no space at all: the map gets it back.'
  default: false
  optional: true
  conditional_validation:
  - when: 'false'
    hidden:
    - alert_rain_threshold
    - alert_snow
    - alert_temp_low
    - alert_temp_high
- keyname: alert_rain_threshold
  field_type: number
  name: Rain Chance At Or Above (%)
  group: Weather
  description: The wettest hour still to come is called out once its chance of rain reaches this. Blank for no rain alert.
  default: 70
  optional: true
- keyname: alert_snow
  field_type: boolean
  name: Alert On Snow
  group: Weather
  description: Call out a day whose forecast is snow, whatever the rain chance says.
  default: true
  optional: true
- keyname: alert_temp_low
  field_type: number
  name: Cold At Or Below
  group: Weather
  description: In whichever unit the board is showing. Blank for no cold alert.
  optional: true
- keyname: alert_temp_high
  field_type: number
  name: Heat At Or Above
  group: Weather
  description: In whichever unit the board is showing. Blank for no heat alert.
  optional: true
name: Metro Calendar
description: Everyone's day as a metro map
refresh_interval: 15
